name: Build Heart Monitor Health Connect Bridge

on:
  push:
    branches: [ health-connect-bridge ]
    paths:
      - 'android-health-bridge/**'
      - '.github/workflows/health-connect-bridge-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-health-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HeartMonitor-HealthConnect-Bridge
          path: android-health-bridge/app/build/outputs/apk/debug/app-debug.apk
